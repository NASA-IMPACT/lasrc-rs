name: Conda package
description: >
  Build the conda package with scripts/conda-build and, if a channel is given, publish it to that
  channel in the project S3 bucket. Expects the repository to be checked out with full history and
  tags (for scripts/version). Publishing needs the job to have the id-token: write permission for
  OIDC.

inputs:
  channel:
    description: >
      Channel name under the bucket, e.g. stable or dev. Leave empty to only build.
    required: false
    default: ""
  bucket:
    description: S3 bucket holding the conda channels (no s3:// prefix). Required to publish.
    required: false
    default: ""
  role-to-assume:
    description: ARN of the AWS role to assume via OIDC. Required to publish.
    required: false
    default: ""
  aws-region:
    description: AWS region of the bucket. Required to publish.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        run-install: false

    - name: Install rattler-build and rattler-index
      shell: bash
      run: pixi global install rattler-build rattler-index

    - name: Configure AWS credentials (OIDC)
      if: inputs.channel != ''
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: gha-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Authenticate rattler-build with S3
      if: inputs.channel != ''
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
      run: |
        rattler-build auth login "s3://$BUCKET" \
          --s3-access-key-id "$AWS_ACCESS_KEY_ID" \
          --s3-secret-access-key "$AWS_SECRET_ACCESS_KEY" \
          --s3-session-token "$AWS_SESSION_TOKEN"

    # When publishing, skip the build if the channel already has this exact package (e.g. a re-run
    # of the same commit), so nothing is ever overwritten
    - name: Build
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel != '' && format('s3://{0}/{1}', inputs.bucket, inputs.channel) || '' }}
        # rattler-build reads S3_* vars for s3:// channels
        S3_REGION: ${{ inputs.aws-region }}
        S3_ENDPOINT_URL: ${{ inputs.aws-region != '' && format('https://s3.{0}.amazonaws.com', inputs.aws-region) || '' }}
      run: |
        args=(--output-dir "$RUNNER_TEMP/conda-output")
        if [[ -n "$CHANNEL" ]]; then
          args+=(--channel "$CHANNEL" --skip-existing=all)
        fi
        scripts/conda-build "${args[@]}"

    - name: Upload and index
      if: inputs.channel != ''
      shell: bash
      env:
        CHANNEL: s3://${{ inputs.bucket }}/${{ inputs.channel }}
        S3_REGION: ${{ inputs.aws-region }}
        S3_ENDPOINT_URL: https://s3.${{ inputs.aws-region }}.amazonaws.com
      run: |
        shopt -s nullglob
        pkgs=("$RUNNER_TEMP"/conda-output/linux-64/*.conda)
        if (( ${#pkgs[@]} == 0 )); then
          echo "Already published to \`$CHANNEL\`; nothing to upload" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        rattler-build upload s3 --channel "$CHANNEL" "${pkgs[@]}"
        rattler-index s3 "$CHANNEL"
        {
          echo "Published to \`$CHANNEL\`:"
          for f in "${pkgs[@]}"; do echo "- \`$(basename "$f")\`"; done
        } >> "$GITHUB_STEP_SUMMARY"
