name: CI

# Every run lints and tests. Conda packages are built and published only after those pass:
# - Every pull request builds the package.
# - Pull requests from this repo then publish to the "dev" channel once a reviewer
#   approves the "conda" environment deployment.
# - Pushes to main and to maintenance branches (maint/vX.Y.x) publish to the "dev" channel.
# - Published releases publish to the "stable" channel once a reviewer approves the "conda"
#   environment deployment.
on:
  push:
    branches: [main, "maint/v*"]
  pull_request:
  release:
    types: [published]

# Only pull requests cancel in-progress runs, so a publish is never interrupted mid-upload
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # lasrc_py links against Python via PyO3; scripts/ point it at uv's .python-version interpreter
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Lint
        run: scripts/lint rust

      - name: Test
        run: scripts/test rust

  python:
    name: Python (ruff, mypy, pytest) and Markdown (rumdl)
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Needed to build the lasrc extension module during `uv sync`
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Lint
        run: scripts/lint python

      - name: Lint Markdown
        run: scripts/lint markdown

      - name: Type check
        run: scripts/typecheck

      - name: Test
        run: scripts/test python

  conda-build:
    name: Build conda package
    needs: [rust, python]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags for scripts/version; PR head (not the merge commit) so the
          # version's sha matches the PR's commit
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/conda-package

  conda-publish-pr:
    name: Publish conda package (dev)
    needs: conda-build
    # Fork and Dependabot PRs can't get an OIDC token
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: conda
    permissions:
      contents: read
      id-token: write # OIDC for AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/conda-package
        with:
          channel: dev
          bucket: ${{ vars.CONDA_CHANNEL_BUCKET }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

  conda-publish-main:
    name: Publish conda package (dev)
    needs: [rust, python]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/maint/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags for scripts/version
          fetch-depth: 0

      - uses: ./.github/actions/conda-package
        with:
          channel: dev
          bucket: ${{ vars.CONDA_CHANNEL_BUCKET }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

  conda-publish-release:
    name: Publish conda package (stable)
    needs: [rust, python]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: conda
    permissions:
      contents: read
      id-token: write # OIDC for AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags for scripts/version
          fetch-depth: 0

      - name: Check release tag is vX.Y.Z
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag $TAG is not a release version (vX.Y.Z)" >&2
            exit 1
          fi

      - uses: ./.github/actions/conda-package
        with:
          channel: stable
          bucket: ${{ vars.CONDA_CHANNEL_BUCKET }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
