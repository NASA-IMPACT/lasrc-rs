[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "lasrc"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "h5py>=3.8",
    "pyhdf>=0.11.7",
    "lxml>=4.9",
    "click>=8.1",
]

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../lasrc_core/Cargo.toml" },
    { file = "../lasrc_core/src/**/*.rs" },
]

[project.scripts]
lasrc-landsat = "lasrc.cli:landsat"
lasrc-sentinel = "lasrc.cli:sentinel"

[tool.pytest.ini_options]
testpaths = ["tests"]
