[package]
name = "lasrc_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "lasrc"
crate-type = ["cdylib"]

[dependencies]
lasrc_core = { path = "../lasrc_core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.17"

[build-dependencies]
pyo3-build-config = "0.29"

[lints]
workspace = true
