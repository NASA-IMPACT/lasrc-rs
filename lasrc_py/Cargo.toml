[package]
name = "lasrc_py"
version.workspace = true
edition = "2021"

[lib]
name = "lasrc"
crate-type = ["cdylib"]

[dependencies]
lasrc_core = { path = "../lasrc_core" }
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
ndarray = "0.17"

[build-dependencies]
pyo3-build-config = "0.30"

[lints]
workspace = true
