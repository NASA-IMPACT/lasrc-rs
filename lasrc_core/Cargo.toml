[package]
name = "lasrc_core"
version.workspace = true
publish = false
edition = "2021"
description = "LaSRC atmospheric correction core algorithms"

[dependencies]
ndarray = "0.17"
rayon = "1.10"

[lints]
workspace = true

# Roll CHANGELOG.md for `cargo release` (release.toml). Configured on one crate so it runs once,
# with paths relative to this crate.
[package.metadata.release]
pre-release-replacements = [
  { file = "../CHANGELOG.md", search = "^## \\[Unreleased\\]$", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "../CHANGELOG.md", search = "^\\[Unreleased\\]: .*$", replace = "[Unreleased]: https://github.com/NASA-IMPACT/lasrc-rs/compare/v{{version}}...HEAD\n[{{version}}]: https://github.com/NASA-IMPACT/lasrc-rs/releases/tag/v{{version}}", exactly = 1 },
]
