[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "lasrc-ancillary"
version = "0.1.0"
description = "Find, fetch and convert ancillary inputs for lasrc"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gdas = [
    "click>=8.1",
    "boto3>=1.28",
    "h5py>=3.8",
    "numpy>=1.24",
    "rasterio>=1.3",
    "scipy>=1.10",
    "xarray>=2023.1",
]

[project.scripts]
lasrc-ancillary = "lasrc_ancillary.cli:main"

[tool.uv.build-backend]
module-name = "lasrc_ancillary"

[tool.pytest.ini_options]
testpaths = ["tests"]
