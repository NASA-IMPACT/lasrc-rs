[workspace]
members = ["lasrc_core", "lasrc_py"]
resolver = "2"

# Placeholder: release versions come from git tags (scripts/version, VERSIONING.md section 1), and
# Conda builds set the Python package version from them. Local builds report this version.
[workspace.package]
version = "0.0.0"

# Ported numerical code mirrors the C function signatures and index-based loops
[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
