context:
  # Set by scripts/conda-build (from git tags) unless LASRC_VERSION is already exported
  version: ${{ env.get("LASRC_VERSION", default="0.0.0") }}

package:
  name: lasrc-rs
  version: ${{ version }}

source:
  # Respects .gitignore, so target/, .venv/ and lasrc_aux/ are not copied
  path: ../

build:
  number: 0
  script:
    env:
      SOURCE_DATE_EPOCH: "0"
      MATURIN_PEP517_ARGS: "--locked"
    content:
      # lasrc_py depends on ../lasrc_core by path, so build from the subdir of the full checkout
      - cd lasrc_py
      - $PYTHON -m pip install . --no-deps --no-build-isolation -vv

requirements:
  build:
    # conda's rust has no rustup, so rust-toolchain.toml is ignored; keep this floor in sync
    - rust >=1.96
  host:
    - python 3.13.*
    - pip
    # maturin is the PEP 517 backend; with --no-build-isolation it must be in the host env
    - maturin >=1.15,<2
  run:
    # Must satisfy lasrc_py/pyproject.toml (the python test runs pip check)
    - python 3.13.*
    - numpy >=1.24
    - rasterio >=1.3
    - h5py >=3.8
    - pyhdf >=0.10,<0.11.7
    - lxml >=4.9
    - click >=8.1

tests:
  - package_contents:
      files:
        exists:
          - bin/lasrc-landsat
          - bin/lasrc-sentinel
  - script:
      - lasrc-landsat --help
      - lasrc-sentinel --help
  - python:
      imports:
        - lasrc.pipeline

about:
  homepage: https://github.com/NASA-IMPACT/lasrc-rs
  license: Unlicense
  license_file: LICENSE
  summary: Rust port of the LaSRC surface reflectance algorithm
